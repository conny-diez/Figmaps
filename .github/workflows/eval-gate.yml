name: CI

on:
  pull_request:
  push:
    branches: [main, 'v*']

# Die Registry für **alle** npm-Aufrufe dieses Workflows, in jedem Job und auch
# im verschachtelten `npm ci` des Baseline-Schritts.
#
# WARUM DAS HIER STEHT UND NICHT IM LOCKFILE: `package-lock.json` trägt in allen
# 211 `resolved`-Feldern eine interne Artifactory-URL, weil `npm install` die
# Registry aus der *Benutzer*konfiguration der Maschine übernimmt, auf der
# zuletzt installiert wurde (eine `.npmrc` gibt es im Repo nicht). Ein
# GitHub-Runner erreicht diesen Host nicht und bekommt `503`; `npm ci` bricht ab,
# und mit ihm alles danach. **Sechs von sechs Läufen seit dem 8.8.2026 sind
# genau daran gescheitert — das Eval-Gate aus A-7 hat deshalb nie ausgeführt.**
#
# `npm ci` ersetzt den Host aus dem Lockfile durch den konfigurierten, sobald
# beide sich unterscheiden; die Integritäts-Hashes bleiben und werden geprüft,
# es ist also kein Aufweichen der Lieferkette. Nachgemessen mit leerem Cache,
# nicht angenommen.
#
# Das Lockfile bleibt unangetastet: es hier zu reparieren wäre folgenlos, weil
# der nächste `npm install` auf einer intern konfigurierten Maschine die Hosts
# zurückschreibt. Der dauerhafte Ort für diese Entscheidung ist eine
# Repo-`.npmrc` oder die Benutzerkonfiguration — beides berührt, wie intern
# gebaut wird, und liegt bei Security.
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  verify:
    name: Typecheck, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Die Version, unter der auch entwickelt wird. `esbuild` zielt weiter
          # auf node20 — das ist die Untergrenze des erzeugten Codes, nicht die
          # Laufzeit des Harness.
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run verify

  eval-gate:
    # A-7 — regression gate: evaluate the 40-image quick set and fail the check
    # if CC drops by more than 0.02 against main.
    #
    # Skipped automatically when the reference data is not available. The
    # fixtures are not in the repo (size + licence, see eval/fixtures/README.md);
    # wire up a cache or an artifact store once the licence question of A-2 is
    # settled, then remove the `if:` guard below.
    name: Eval regression gate
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Restore reference data
        id: fixtures
        uses: actions/cache/restore@v6
        with:
          path: eval/fixtures
          key: figmaps-fixtures-v1

      - name: Report missing fixtures
        if: steps.fixtures.outputs.cache-hit != 'true'
        run: |
          echo "::notice title=Eval-Gate übersprungen::Kein Referenz-Set im Cache." >> "$GITHUB_STEP_SUMMARY"
          echo "Das Gate ist erst scharf, wenn eval/fixtures unter dem Key figmaps-fixtures-v1 liegt." >> "$GITHUB_STEP_SUMMARY"

      - name: Baseline on main
        if: steps.fixtures.outputs.cache-hit == 'true'
        run: |
          git worktree add ../main-ref origin/main
          cp -R eval/fixtures ../main-ref/eval/fixtures
          cd ../main-ref
          npm ci
          npm run eval -- --set quick --report /tmp/gate-main.md --gate --baseline "$GITHUB_WORKSPACE/gate-main.json" --write

      - name: Gate on this PR
        if: steps.fixtures.outputs.cache-hit == 'true'
        run: npm run eval -- --set quick --report gate-pr.md --gate --baseline gate-main.json --max-cc-drop 0.02

      - name: Publish report
        if: always() && steps.fixtures.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: eval-gate
          path: |
            gate-pr.md
            gate-pr-kontaktbogen.png
          if-no-files-found: ignore
