name: CI

on:
  pull_request:
  push:
    branches: [main, 'v*']

# Die Registry für **alle** npm-Aufrufe dieses Workflows, in jedem Job und auch
# im verschachtelten `npm ci` des Baseline-Schritts.
#
# WARUM DAS HIER STEHT UND NICHT IM LOCKFILE: `package-lock.json` trägt in allen
# 211 `resolved`-Feldern eine interne Artifactory-URL, weil `npm install` die
# Registry aus der *Benutzer*konfiguration der Maschine übernimmt, auf der
# zuletzt installiert wurde (eine `.npmrc` gibt es im Repo nicht). Ein
# GitHub-Runner erreicht diesen Host nicht und bekommt `503`; `npm ci` bricht ab,
# und mit ihm alles danach. **Sechs von sechs Läufen seit dem 8.8.2026 sind
# genau daran gescheitert — das Eval-Gate aus A-7 hat deshalb nie ausgeführt.**
#
# `NPM_CONFIG_REGISTRY` allein genügt dafür **nicht** — lokal (npm 11.11)
# ersetzt npm den Host aus dem Lockfile, auf dem Runner tut es das nicht.
# Nachgemessen, nicht angenommen: der erste Versuch mit nur dieser Variablen ist
# mit demselben 503 gescheitert.
#
# SEIT 1.3 IST DAS EINGECHECKTE LOCKFILE SELBST FREI DAVON. Die 211
# `resolved`-Adressen sind entfernt, `integrity` steht in jedem Eintrag und wird
# von `npm ci` geprüft — nachgemessen ergibt das dieselbe Installation, 0 von 211
# Abweichungen in Version und Hash. Aus der Reparatur auf dem Runner ist damit
# eine **Invariante im Repo** geworden, und `--check` bewacht sie: kommt eine
# Adresse zurück, wird CI rot statt still zu reparieren.
#
# Die mutierende Betriebsart bleibt für einen Fall: das Gate baut seine Referenz
# in einem Worktree von `origin/main`, und jeder Commit von vor dieser Änderung
# trägt die Adressen für immer in der History.
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  verify:
    name: Typecheck, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Die Version, unter der auch entwickelt wird. `esbuild` zielt weiter
          # auf node20 — das ist die Untergrenze des erzeugten Codes, nicht die
          # Laufzeit des Harness.
          node-version: '24'
          cache: npm
      # Prüfen statt reparieren. Die eingecheckte Datei ist seit 1.3 frei von
      # `resolved`-Adressen; kommt eine zurück (ein `npm install` auf einer
      # Maschine mit interner Registry genügt), soll das auffallen und nicht
      # still behoben werden.
      - run: node scripts/ci-lockfile.mjs --check
      - run: npm ci
      - run: npm run lint
      - run: npm run verify

      # Ein grüner Haken sagt nicht, worüber er grün ist. Dieser Schritt schreibt
      # in die Zusammenfassung, welche Netze diesen Lauf abdecken und welche
      # nicht — und wo die Durchsetzung für das Fehlende stattfindet.
      #
      # Er urteilt nicht und wird nie rot. Nach dem Schnitt in ein öffentliches
      # und ein privates Repo läuft das Eval-Gate öffentlich nicht mehr, und ein
      # PR wäre dort grün mit einem Netz weniger, ohne dass es irgendwo steht.
      # Erkannt wird der Zustand, nicht behauptet: dasselbe Skript läuft in beiden
      # Repos und sagt in jedem die Wahrheit.
      - name: Was dieser Lauf abdeckt
        if: always()
        run: node scripts/gate-coverage.mjs

  eval-gate:
    # A-7 — Regressions-Gate: bewertet das eingecheckte 40-Bild-Set und macht
    # den Check rot, wenn CC gegenüber `main` um mehr als 0,02 fällt.
    #
    # GESCHICHTE, WEIL SIE DEN AUFBAU ERKLÄRT. Dieses Gate hat bis 1.2 nie
    # gemessen, aus drei aufeinanderfolgenden Gründen:
    #
    #   1. Der Job davor war rot (npm ci, siehe oben), also lief es gar nicht.
    #   2. Danach lief es und meldete „übersprungen": das Referenz-Set lag in
    #      einem Actions-Cache, der leer war. Ein grüner Haken ohne Messung.
    #   3. Und als es endlich lief, bewachte es die **eingefrorene**
    #      1.0-Referenz statt der ausgelieferten Engine — eine Zahl, die sich
    #      per Definition nicht ändern kann.
    #
    # Dreimal dieselbe Fehlerklasse wie bei `cold-fold` und `flat`: eine
    # Prüfung, die grün ist, weil sie das Falsche ansieht oder gar nichts.
    # Deshalb liegt das Set jetzt im Repo statt in einem Cache, und deshalb
    # steht am Ende ein Schritt, der beweist, dass das Gate rot werden **kann**.
    name: Eval regression gate
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # Prüfen statt reparieren. Die eingecheckte Datei ist seit 1.3 frei von
      # `resolved`-Adressen; kommt eine zurück (ein `npm install` auf einer
      # Maschine mit interner Registry genügt), soll das auffallen und nicht
      # still behoben werden.
      - run: node scripts/ci-lockfile.mjs --check
      - run: npm ci

      - name: Baseline on main
        run: |
          git worktree add ../main-ref origin/main
          # Die Fixtures kommen aus *diesem* Checkout: auf main liegen sie
          # (noch) nicht, und die Baseline muss auf demselben Set laufen.
          rm -rf ../main-ref/eval/fixtures
          cp -R eval/fixtures ../main-ref/eval/fixtures
          cd ../main-ref
          node "$GITHUB_WORKSPACE/scripts/ci-lockfile.mjs" package-lock.json
          npm ci
          # `--engine` ausdrücklich: main hat noch die alte Voreinstellung, die
          # auf die eingefrorene 1.0-Referenz zeigt (Grund 3 oben).
          for set in gate-web gate-mobile; do
            npm run eval -- --engine hybrid-v1 --fixtures "$set" --set quick \
              --report "/tmp/gate-main-$set.md" --gate --baseline "$GITHUB_WORKSPACE/gate-main-$set.json" --write
          done

      - name: Gate on this PR
        run: |
          for set in gate-web gate-mobile; do
            npm run eval -- --fixtures "$set" --set quick \
              --report "gate-pr-$set.md" --gate --baseline "gate-main-$set.json" --max-cc-drop 0.02
          done

      - name: Das Gate muss rot werden können
        # Der Erreichbarkeitstest für das Gate selbst. Eine absichtlich
        # verschlechterte Engine (`blendGamma` 0,3 kostet rund 0,05 CC in jeder
        # gemessenen Gruppe) MUSS den Schritt zum Scheitern bringen. Tut sie es
        # nicht, sieht das Gate wieder etwas Falsches an — und das würde sonst
        # erst auffallen, wenn eine echte Regression durchrutscht.
        run: |
          if npm run eval -- --fixtures gate-web --set quick --report /tmp/gate-selftest.md \
               --gate --baseline gate-main-gate-web.json --max-cc-drop 0.02 --blend-gamma 0.3; then
            echo "::error title=Gate-Selbsttest::Eine absichtlich verschlechterte Engine hat das Gate PASSIERT."
            echo "Das Gate misst nicht, was es messen soll. Siehe .github/workflows/eval-gate.yml."
            exit 1
          fi
          echo "Gate-Selbsttest bestanden: die verschlechterte Engine wurde abgelehnt." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-gate
          path: |
            gate-pr-*.md
            gate-pr-*-kontaktbogen.png
          if-no-files-found: ignore

  contrast-gate:
    # 1.3 — das ZWEITE Regressions-Gate, für die Contrastmap.
    #
    # WARUM ES EIN ZWEITES BRAUCHT. Das Gate darüber bewertet 40 UEyes-Bilder
    # und schützt damit genau eine Ausgabe: die Vorhersage. Die Contrastmap
    # kommt darin überhaupt nicht vor, und zwar aus einem Grund, der sich nicht
    # beheben lässt — ein Screenshot hat keine Ebenen, also keinen Textknoten,
    # keine Textfarbe und keine Schriftgröße. Auf dem Gate-Set misst die
    # Contrastmap NULL Elemente.
    #
    # Die belastbarste Ausgabe des Plugins — die einzige, die als überprüfbare
    # Tatsache auftritt — hatte damit keinen Regressionsschutz. Und das ist
    # nicht theoretisch: alle drei Messfehler von 1.2 (fehlende Textfarbe,
    # Kantenglättung, Auflösung) saßen nicht in der Rechnung, sondern in der
    # Pipeline auf echten Frames. Alle drei Male waren die Unit-Tests grün.
    #
    # WARUM KEIN BASELINE-LAUF AUF `main`. Der Korpus ist Code (die
    # Generatoren), nicht Daten — ein Lauf im `main`-Worktree würde `main`s
    # Generatoren gegen `main`s Messung stellen und wäre immer grün. Die
    # Erwartung liegt deshalb als `eval/contrast-baseline.json` im Repo: jede
    # Bewegung der Zahlen ist dann eine Zeile im Diff, die ein Mensch im PR
    # sieht. Ein Vergleich, der nur im Log stattfindet, zeigt sie niemandem.
    name: Contrast regression gate
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # Prüfen statt reparieren. Die eingecheckte Datei ist seit 1.3 frei von
      # `resolved`-Adressen; kommt eine zurück (ein `npm install` auf einer
      # Maschine mit interner Registry genügt), soll das auffallen und nicht
      # still behoben werden.
      - run: node scripts/ci-lockfile.mjs --check
      - run: npm ci

      - name: Gate
        run: npm run contrast-gate

      - name: Wurde die Erwartung selbst verändert?
        # Die Zahlen zu aktualisieren ist erlaubt und manchmal richtig. Es STILL
        # zu tun ist es nicht — eine Erwartung, die im selben Commit mitwandert,
        # ist kein Gate. Der Schritt macht den Check nicht rot; er stellt die
        # Bewegung in die Zusammenfassung, wo sie ein Reviewer sieht.
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
          if git diff --quiet "$base" -- eval/contrast-baseline.json; then
            echo "Erwartung unverändert."
            echo "Erwartung unverändert." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Die Erwartung wurde in diesem PR verändert — der Diff steht in der Zusammenfassung."
            {
              echo "### Die Contrastmap-Erwartung hat sich bewegt"
              echo ""
              echo 'Das ist erlaubt — aber es muss im PR-Text begründet sein.'
              echo ""
              echo '```diff'
              git diff "$base" -- eval/contrast-baseline.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Contrast-Erwartung geändert::Die Zahlen der Contrastmap haben sich bewegt. Begründung gehört in den PR-Text."
          fi

      - name: Das Gate muss rot werden können
        # Zwei Erreichbarkeitstests, und sie prüfen verschiedene Hälften:
        #
        #   --limits-off   schaltet die Erkennung von Drehung und Verdeckung ab
        #                  (1.3, 1a). Die Gegenprobe wird dann wieder vollständig
        #                  „gemessen" — mit Werten über Fremdpixel.
        #   --max-edge 200 lässt die Messung auf einem verkleinerten Bild laufen.
        #                  Das ist der historische Fehler Nr. 3 in Reinform, und
        #                  genau der Grund, aus dem dieses Gate existiert.
        #
        # Passiert einer davon, sieht das Gate etwas Falsches an — und das würde
        # sonst erst auffallen, wenn eine echte Regression durchrutscht.
        run: |
          fail=0
          for flag in "--limits-off" "--max-edge 200"; do
            if npm run contrast-gate -- $flag > /tmp/selftest.log 2>&1; then
              echo "::error title=Contrast-Gate-Selbsttest::Ein absichtlich verschlechterter Lauf ($flag) hat das Gate PASSIERT."
              echo "Das Gate misst nicht, was es messen soll. Siehe .github/workflows/eval-gate.yml."
              cat /tmp/selftest.log
              fail=1
            else
              # Auch auf stdout, nicht nur in die Zusammenfassung: der Beweis,
              # dass das Gate beißt, gehört ins Log. Sonst ist der einzige
              # Nachweis ein grüner Haken — und ein grüner Haken ohne Messung
              # ist genau das, was das erste Gate dreimal war.
              echo "Selbsttest bestanden: $flag wurde abgelehnt."
              echo "Selbsttest bestanden: $flag wurde abgelehnt." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit $fail
