name: Release

# Baut das Plugin bei einem Versions-Tag und hängt ein installierbares Zip an
# das Release.
#
# WARUM EIN ZIP UND NICHT „klont euch das Repo". Figmas „Import plugin from
# manifest…" erwartet einen Ordner, in dem `manifest.json` **neben** den
# gebauten Dateien liegt. Wer das Repo klont, muss vorher `npm ci && npm run
# build` laufen lassen — und wer das vergisst, bekommt ein Plugin, das nicht
# startet. Das Zip enthält genau die vier Dinge, die Figma liest.
#
# WAS DABEI SCHIEFGEHEN KANN, OHNE DASS ES JEMAND MERKT: der Ortsprior. Fehlt er
# im Bundle, fällt die Engine still auf die analytische F-Muster-Glocke zurück —
# keine Meldung, kein Fehler, nur schlechtere Karten. Deshalb steht
# `scripts/check-release.mjs` zwischen Bau und Zip und prüft die **Nutzdaten**,
# nicht die Dateinamen.

on:
  push:
    tags: ['v*']
  # Ohne Tag baubar, um den Workflow selbst zu prüfen, ohne ein Release
  # anzulegen. Das Zip landet dann nur als Artefakt.
  workflow_dispatch:

# Siehe eval-gate.yml — dieselbe Begründung, dieselbe Notwendigkeit.
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

permissions:
  contents: write

jobs:
  release:
    name: Build, prüfen, packen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/ci-lockfile.mjs
      - run: npm ci

      # Ein Release ist kein Ort für ungeprüften Code. Derselbe Lauf wie in CI,
      # nicht eine abgekürzte Fassung davon.
      - run: npm run lint
      - run: npm run verify

      - name: Version gegen den Tag prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        # Die Version steht laut Aufbau an **einer** Stelle (package.json, von
        # dort als Build-Zeit-Konstante ins Panel). Ein Tag, der davon abweicht,
        # würde diese eine Stelle wieder zu zweien machen: das Panel zeigte
        # etwas anderes als das Release heißt.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error title=Version::Tag v$tag, package.json $pkg — die beiden müssen übereinstimmen."
            exit 1
          fi
          echo "Version $pkg stimmt mit dem Tag überein." >> "$GITHUB_STEP_SUMMARY"

      - name: Ortsprior und Nennung im Bundle prüfen
        run: node scripts/check-release.mjs

      - name: Zip bauen
        id: pack
        # Struktur so, dass „Import plugin from manifest…" direkt auf die
        # `manifest.json` im entpackten Ordner zeigen kann:
        #
        #   figmaps-1.2.0/
        #     manifest.json
        #     build/main.js
        #     build/ui.html
        #     LIESMICH.txt
        #
        # `manifest.json` verweist relativ auf `build/…`, also muss der
        # Ordner mit ins Zip — eine flache Ablage würde Figma nicht finden.
        run: |
          version="$(node -p "require('./package.json').version")"
          dir="figmaps-$version"
          mkdir -p "$dir/build"
          cp manifest.json "$dir/manifest.json"
          cp build/main.js build/ui.html "$dir/build/"
          cp NOTICE.md "$dir/NOTICE.md"
          cat > "$dir/LIESMICH.txt" <<'TXT'
          Figmaps in Figma installieren
          =============================

          1. Diesen Ordner entpacken und an einen dauerhaften Ort legen —
             Figma merkt sich den Pfad, ein Ordner im Download-Verzeichnis
             verschwindet irgendwann.
          2. In Figma: Menü → Plugins → Development → Import plugin from
             manifest…  und die Datei manifest.json in diesem Ordner wählen.
          3. Einen Frame auswählen und das Plugin über Plugins → Development →
             Figmaps starten.

          Die Heatmap und die Focusmap sind VORHERSAGEN, keine Messungen. Die
          Contrastmap ist eine Messung nach WCAG 2.1 AA und nachrechenbar.

          Datengrundlage der Vorhersage: UEyes (Jiang et al. 2023), CC BY 4.0 —
          Einzelheiten in NOTICE.md.
          TXT
          zip -r "$dir.zip" "$dir" > /dev/null
          echo "zip=$dir.zip" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Das Zip auspacken und prüfen
        # Gepackt ist nicht installierbar. Dieser Schritt entpackt das Zip an
        # einem anderen Ort und prüft dort, was Figma prüfen würde: liegt die
        # `manifest.json` da, wo sie hingehört, und zeigen ihre Pfade auf
        # Dateien, die es gibt. Ohne das wäre der vorige Schritt nur die
        # Behauptung, ein Zip gebaut zu haben.
        run: |
          mkdir -p /tmp/verify && cd /tmp/verify
          unzip -q "$GITHUB_WORKSPACE/${{ steps.pack.outputs.zip }}"
          cd "figmaps-${{ steps.pack.outputs.version }}"
          for field in main ui; do
            path="$(node -p "require('./manifest.json').$field")"
            if [ ! -s "$path" ]; then
              echo "::error title=Zip::manifest.$field zeigt auf '$path' — dort liegt nichts."
              exit 1
            fi
            echo "manifest.$field -> $path ($(wc -c < "$path") Bytes)"
          done
          # Und noch einmal die Prüfung der Nutzdaten, diesmal auf dem
          # entpackten Stand: was hier fehlt, fehlt bei der Nutzerin.
          node "$GITHUB_WORKSPACE/scripts/check-release.mjs"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.zip }}
          path: ${{ steps.pack.outputs.zip }}

      - name: Release anlegen oder ergänzen
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        # `--draft` mit Absicht: der Text wird vor der Veröffentlichung gelesen.
        # Ein Release, das sich selbst veröffentlicht, nimmt diese Entscheidung
        # vorweg — und ein Zip zurückzuziehen, das schon jemand geladen hat,
        # geht nicht.
        #
        # WARUM HIER NICHT MEHR EINFACH `gh release create` STEHT. Nachgemessen:
        # der Befehl legt auch dann einen weiteren Entwurf an, wenn zum Tag schon
        # einer existiert — zwei `untagged-…`-Objekte, kein Fehler, kein Hinweis.
        # Ein Entwurf ist nicht an den Tag gebunden, es gibt also nichts, womit er
        # kollidieren könnte. Genau daraus ist der Vorfall bei v1.2.0 entstanden:
        # zwei Objekte zum selben Tag, das Asset am falschen.
        #
        # Deshalb wird zuerst gefragt, was es gibt, und dann ergänzt statt
        # gedoppelt. Bei mehr als einem Objekt bricht der Schritt ab — welches
        # das richtige ist, kann er nicht wissen, und raten wäre die Ursache
        # noch einmal.
        #
        # Über die API und nicht über `gh release upload <tag>`: dessen
        # Tag-Auflösung findet Entwürfe nicht (`GET /releases/tags/<tag>` liefert
        # nur Veröffentlichtes). Der Asset-Endpunkt mit der Release-Id trifft
        # beide Fälle.
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.pack.outputs.zip }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          releases="repos/$GITHUB_REPOSITORY/releases"

          # Jede Abfrage in EINEM `gh --jq`-Durchgang, nur Skalare heraus.
          #
          # Nachgemessen: die Ausgabe von `gh --jq` ist kein wieder-parsebares
          # JSON, wenn ein String Zeilenumbrüche enthält — und der Release-Text
          # enthält sie zu Tausenden. `gh api … --jq '[…]' | jq length` bricht mit
          # „control characters must be escaped" ab. Ein zweiter jq-Aufruf über
          # eine gh-Ausgabe ist deshalb hier grundsätzlich falsch.
          count="$(gh api "$releases?per_page=100" --jq "[.[] | select(.tag_name == \"$tag\")] | length")"

          if [ "$count" -gt 1 ]; then
            echo "::error title=Release::$count Release-Objekte tragen den Tag $tag. Welches gemeint ist, kann dieser Schritt nicht entscheiden — genau daraus ist der Vorfall bei v1.2.0 entstanden."
            gh api "$releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$tag\") | \"  id=\(.id) draft=\(.draft) assets=\(.assets|length) \(.html_url)\""
            exit 1
          fi

          # Nutzlast mit `jq --rawfile`: RELEASE.md ist mehrere Kilobyte Markdown
          # mit Anführungszeichen, Backticks und Zeilenumbrüchen. Über
          # `-f key=@datei` wäre das von gh's Typ-Umwandlung abhängig; so ist es
          # eindeutig. (`jq` liest hier eine Datei, keine gh-Ausgabe.)
          if [ "$count" -eq 0 ]; then
            jq -n --rawfile body RELEASE.md --arg tag "$tag" --arg name "Figmaps ${tag#v}" \
              '{tag_name: $tag, name: $name, draft: true, prerelease: false, body: $body}' > /tmp/release.json
            id="$(gh api --method POST "$releases" --input /tmp/release.json --jq '.id')"
            echo "Entwurf neu angelegt (id=$id)."
          else
            id="$(gh api "$releases?per_page=100" --jq "[.[] | select(.tag_name == \"$tag\")] | .[0].id")"
            # Nur den Text nachziehen — Entwurfsstatus und Name des bestehenden
            # Objekts bleiben, wie ein Mensch sie gesetzt hat.
            jq -n --rawfile body RELEASE.md '{body: $body}' > /tmp/patch.json
            gh api --method PATCH "$releases/$id" --input /tmp/patch.json --jq '.id' > /dev/null
            echo "Bestehendes Objekt ergänzt (id=$id) — Text aus RELEASE.md aktualisiert."
            old="$(gh api "$releases/$id" --jq "[.assets[] | select(.name == \"$ZIP\") | .id] | .[0] // empty")"
            if [ -n "$old" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
              echo "Vorherige Fassung von $ZIP entfernt."
            fi
          fi

          gh api --method POST \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$ZIP" \
            -H "Content-Type: application/zip" --input "$ZIP" --jq '.name' > /dev/null
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Nachweisen, dass das Asset am Objekt hängt
        if: startsWith(github.ref, 'refs/tags/v')
        # KEIN GRÜNER HAKEN OHNE NACHWEIS. Der Schritt davor sagt „hochgeladen";
        # dieser sieht nach. Ein Upload, dessen Ergebnis niemand liest, ist eine
        # Behauptung — und die letzte Behauptung dieser Art hat einen Kollegen
        # einen Nachmittag gekostet.
        #
        # WAS HIER NICHT BEWIESEN WERDEN KANN, und das gehört ausdrücklich
        # hierher: solange das Release ein **Entwurf** ist, hängt das Asset nicht
        # am Tag. GitHub gibt ihm eine `untagged-…`-URL, und `releases/tag/<tag>`
        # findet es nicht. Die Frage „liegt die Datei dort, wo eine Nutzerin sie
        # sucht" ist erst nach der Veröffentlichung beantwortbar — dafür gibt es
        # `release-verify.yml`, das am `release: published`-Ereignis hängt und die
        # Datei aus dem Release **lädt und auspackt**.
        #
        # Dieser Schritt beweist also die Hälfte, die jetzt beweisbar ist, und
        # sagt die andere Hälfte als Auftrag an einen Menschen.
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.pack.outputs.zip }}
          ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          rel="repos/$GITHUB_REPOSITORY/releases/$ID"
          size="$(gh api "$rel" --jq "[.assets[] | select(.name == \"$ZIP\") | .size] | .[0] // 0")"
          if [ "$size" -eq 0 ]; then
            echo "::error title=Asset::$ZIP hängt nicht am Release-Objekt $ID (oder ist leer)."
            gh api "$rel" --jq '"Vorhandene Assets: " + ([.assets[].name] | join(", "))'
            exit 1
          fi
          draft="$(gh api "$rel" --jq '.draft')"
          url="$(gh api "$rel" --jq '.html_url')"
          expected="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$ZIP"
          {
            echo "### Release $tag"
            echo ""
            echo "- Objekt: $url"
            echo "- Asset: \`$ZIP\`, $size Bytes — nachgesehen, nicht angenommen"
            if [ "$draft" = "true" ]; then
              echo "- **Entwurf.** Am Tag liegt noch nichts: \`releases/tag/$tag\` findet diesen"
              echo "  Entwurf nicht, und die beiden automatischen „Source code\"-Archive sind"
              echo "  Quellcode ohne \`build/\` — damit scheitert der Figma-Import."
              echo "- **Zu tun:** den Entwurf unter $url veröffentlichen. Danach prüft"
              echo "  \`release-verify.yml\` die Datei am Tag und lädt sie dafür herunter."
              echo "- Danach erreichbar unter: $expected"
            else
              echo "- Veröffentlicht. Download: $expected"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Asset $ZIP ($size Bytes) hängt an $url"
          if [ "$draft" = "true" ]; then
            echo "::notice title=Noch nicht am Tag::Der Entwurf muss veröffentlicht werden, sonst findet niemand das Zip. $url"
          fi
